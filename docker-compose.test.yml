services:
  test-runner:
    build:
      context: .
      target: builder
    volumes:
      - .:/app
    environment:
      - DB_HOST=test-db
      - REDIS_HOST=test-redis
      - REDIS_PORT=6379
      - DB_USER=test_user
      - DB_PASSWORD=test_pass
      - MINIO_ROOT_USER=test_minio
      - MINIO_ROOT_PASSWORD=test_minio_pass
      - MINIO_ENDPOINT=test-minio:9090
      - MYSQL_ROOT_PASSWORD=test_root_pass
      - MYSQL_DATABASE=playbacq_test
      - MYSQL_USER=test_user
      - MYSQL_PASSWORD=test_pass
      - S3_ENDPOINT=http://test-minio:9090
      - MODAL_HOST=http://127.0.0.1:9999
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-test-key}
      - YOUTUBE_API_BASE_URL=http://127.0.0.1:9999
      - TRAQ_TOKEN=${TRAQ_TOKEN:-test-token}
      - TRAQ_API_URL=http://127.0.0.1:9999
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-minio:
        condition: service_started
      test-minio-init:
        condition: service_completed_successfully
    # テストのビルドと実行を行うコマンド
    command: >
      bash -c "mkdir -p build/test && cd build/test && 
      cmake -DENABLE_COVERAGE=ON -DBUILD_TESTING=ON -DBUILD_LOCAL_DEV=ON ../.. && 
      cmake --build . -j$$(nproc) && 
      ctest --output-on-failure -VV &&
      apt-get update && apt-get install -y gcovr &&
      gcovr -r /app . --exclude '.*/test/.*' --xml-pretty -o /app/coverage.xml"

  test-db:
    image: mysql:8.0
    tmpfs:
      - /var/lib/mysql # データをすべてメモリ上に配置
    volumes:
      - ./docker/init.test.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_DATABASE=playbacq_test
      - MYSQL_USER=test_user
      - MYSQL_PASSWORD=test_pass
      - MYSQL_ROOT_PASSWORD=test_root_pass
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "test_user",
          "-ptest_pass",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  test-minio:
    image: adobe/s3mock:latest

  test-minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      test-minio:
        condition: service_started
    environment:
      - AWS_ACCESS_KEY_ID=test_minio
      - AWS_SECRET_ACCESS_KEY=test_minio_pass
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      sh -c "
        until aws --no-sign-request --endpoint-url=http://test-minio:9090 s3api list-buckets >/dev/null 2>&1; do sleep 1; done &&
        aws --no-sign-request --endpoint-url=http://test-minio:9090 s3api create-bucket --bucket videos 2>/dev/null || true &&
        aws --no-sign-request --endpoint-url=http://test-minio:9090 s3api create-bucket --bucket videofiles 2>/dev/null || true
      "
