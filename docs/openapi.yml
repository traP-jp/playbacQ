openapi: 3.1.0
info:
  title: playbacQ
  version: "0.0.1"
  description: "playbacQサーバーのAPIです。"
  contact:
    name: traP
    url: "https://trap.jp/"

servers:
  - url: "http://localhost:8080"
    description: local

paths:
  /api/videos:
    get:
      summary: "動画一覧の取得"
      operationId: getVideos
      x-tested: true
      tags:
        - Video
      parameters:
        - schema:
            type: "string"
          name: "userId"
          in: "query"
          description: "ユーザーIDで動画をフィルタリングします。"
        - schema:
            type: "string"
          name: "search"
          in: "query"
          description: "動画のタイトルや説明で検索します。"
        - schema:
            type: "string"
          name: "tag"
          in: "query"
          description: "動画のタグでフィルタリングします。"
        - schema:
            type: "string"
          name: "sortby"
          in: "query"
          description: "動画の並び順を指定します。"
        - schema:
            type: "integer"
          name: "order"
          in: "query"
          description: "動画の並び順を昇順(1)か降順(0)で指定します。"
      responses:
        "200":
          description: "動画の一覧を取得します。"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      summary: "動画の投稿"
      operationId: createVideo
      x-tested: true
      tags:
        - Video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: "動画のタイトル"
                description:
                  type: string
                  description: "動画の説明"
                content_type:
                  type: string
                  description: "動画ファイルのContent-Type"
                  example: "video/mp4"
      responses:
        "201":
          description: "動画が作成されました。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: "リクエストが不正です。"
        "403":
          description: "アクセスが拒否されました。"
    delete:
      summary: "動画の削除"
      description: "動画とそれに関連するデータ(コメント、タグなど)を削除します。タグそのものは消えません。動画の投稿者のみが削除できます。"
      operationId: deleteVideo
      x-tested: true
      tags:
        - Video
      parameters:
        - name: video_id
          in: query
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画が削除されました。"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"

  /api/ex-videos:
    post:
      summary: "外部動画を取り込む"
      description: "外部動画サービスから動画を取り込みます。titleやdescriptionを省略した場合は、外部サービスから取得した情報を使用します。現在はYoutubeのみサポートされています。"
      operationId: importExternalVideo
      x-tested: false
      tags:
        - Video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                title:
                  type: string
                  description: "動画のタイトル"
                  example: "還月 / 2026年度 春ハッカソン 24班"
                description:
                  type: string
                  description: "動画の説明"
                  example: "2026年度 春ハッカソン 24班の動画です。"
                url:
                  type: string
                  description: "動画のリンク"
                  example: "https://youtu.be/fV04ZVNpfIk"
      responses:
        "201":
          description: "動画が作成されました。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: "リクエストが不正です。"
        "403":
          description: "アクセスが拒否されました。"
        "500":
          description: "サーバー内部エラー"

  /api/ex-videos/sync:
    post:
      summary: "外部動画のデータを同期する"
      description: "JSONのidsで指定した1〜50件の外部動画について、YouTubeの公開動画メタデータを1回の videos.list（1 quota unit）で取得して保存し、指定された動画情報・統計を一括同期します。同じtargetsが全動画に適用されます。YouTubeの正常応答内で動画やフィールドが欠落した場合は、取得できたデータだけを更新し、結果をpartialまたはskippedとして返します。YouTubeリクエスト自体の失敗時は更新せず、DB更新は1トランザクションで処理します。コメントは取得しません。fileDetails、processingDetails、suggestions、および公開 part 内の投稿者限定プロパティは取得結果に含めません。"
      operationId: syncExternalVideo
      x-tested: true
      tags:
        - Video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
                - targets
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  description: "同期するplaybacQ内の動画ID。指定順でresultsを返します。"
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                targets:
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    video:
                      type: object
                      required:
                        - fields
                      additionalProperties: false
                      properties:
                        fields:
                          type: array
                          minItems: 1
                          uniqueItems: true
                          items:
                            type: string
                            enum:
                              - title
                              - description
                              - duration
                              - type
                    statistics:
                      type: object
                      required:
                        - fields
                      additionalProperties: false
                      properties:
                        fields:
                          type: array
                          minItems: 1
                          uniqueItems: true
                          items:
                            type: string
                            enum:
                              - view_count
                              - like_count
                              - comment_count
            example:
              ids:
                - "external-video-id-1"
                - "external-video-id-2"
              targets:
                video:
                  fields:
                    - title
                    - description
                    - duration
                    - type
                statistics:
                  fields:
                    - view_count
                    - like_count
                    - comment_count
      responses:
        "200":
          description: "同期処理が完了しました。動画・フィールド単位の部分成功を含みます。"
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - quota_units
                properties:
                  results:
                    type: array
                    minItems: 1
                    description: "リクエストのidsと同じ順序の同期結果"
                    items:
                      type: object
                      required:
                        - id
                        - status
                      properties:
                        id:
                          type: string
                          description: "playbacQ内の動画ID"
                        status:
                          type: string
                          enum:
                            - updated
                            - partial
                            - skipped
                          description: "updatedは指定データをすべて更新、partialは取得できたフィールドだけ更新、skippedは動画リソース自体が返らず更新なし"
                        video:
                          $ref: "#/components/schemas/Video"
                        metadata:
                          type: object
                          description: "今回取得・保存したYouTubeの公開動画メタデータ。updatedまたはpartialの場合に返し、投稿者限定情報は除外済みです。"
                        synced:
                          type: object
                          description: "今回実際に同期したフィールドと値。updatedまたはpartialの場合に返します。"
                        skipped:
                          type: object
                          description: "取得結果に存在せず更新しなかったフィールドと理由。partialの場合に返します。"
                        reason:
                          type: string
                          enum:
                            - youtube_video_not_returned
                          description: "動画全体を更新しなかった理由。skippedの場合に返します。"
                  quota_units:
                    type: integer
                    const: 1
                    description: "この一括同期全体が消費するYouTube Data API quota unit"
        "400":
          description: "リクエストの形式、対象、またはフィールド指定が不正です。comments は指定できません。"
        "401":
          description: "認証されていません。"
        "403":
          description: "指定動画のいずれかの投稿者ではありません。"
        "404":
          description: "指定動画のいずれかが見つかりませんでした。"
        "409":
          description: "指定動画のいずれかが内部動画、または未対応の外部動画です。"
        "500":
          description: "サーバー設定またはDB処理に失敗しました。"
        "502":
          description: "YouTube APIリクエスト全体が失敗、またはレスポンス形式が不正で、同期を開始できませんでした。"

  /api/videos/{id}:
    get:
      summary: "動画の取得"
      operationId: getVideoById
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画を返します。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
    patch:
      summary: "動画の更新"
      operationId: updateVideo
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title:
                  type: string
                  description: "動画のタイトル"
                description:
                  type: string
                  description: "動画の説明"
      responses:
        "200":
          description: "動画が更新されました。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: "リクエストが不正です。"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
  /api/videos/{id}/comments:
    get:
      summary: "動画のコメントの取得"
      operationId: getCommentsByVideoId
      x-tested: true
      tags:
        - Comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画のコメントを返します。"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Comment"
    post:
      summary: "動画のコメントの投稿"
      operationId: createComment
      x-tested: true
      tags:
        - Comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: "コメントの内容"
                timestamp:
                  type: number
                  format: double
                  description: "コメントの投稿時間"
                command:
                  type: string
                  description: "コメントのコマンド(Json文字列)"
      responses:
        "201":
          description: "コメントが作成されました。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
    delete:
      summary: "動画のコメントの削除"
      description: "動画のコメントを削除します。コメントしたユーザーまたは動画の投稿者のみが削除できます。"
      operationId: deleteComment
      x-tested: true
      tags:
        - Comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment_id:
                  type: integer
                  description: "削除するコメントのID"
      responses:
        "200":
          description: "コメントが削除されました。"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画またはコメントが見つかりませんでした。"
  /api/videos/{id}/progress:
    get:
      summary: "動画のアップロードの進捗の取得"
      operationId: getVideoProgress
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画のアップロードの進捗を返します。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  progress:
                    type: number
                    format: int
                    description: "動画のアップロードの進捗(0~100)"
                  status:
                    type: string
                    description: "動画のアップロードの状態(pending, processing, completed, failed)"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
  /api/videos/{id}/play:
    get:
      summary: "署名付きurlを含む.m3u8ファイルの取得"
      operationId: getVideoPlayUrl
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "署名付きurlを含む.m3u8ファイルを返します。"
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                description: "署名付きurlを含む.m3u8ファイルの内容"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
  /api/videos/{id}/views:
    post:
      summary: "動画の再生回数のインクリメント"
      operationId: incrementVideoViewCount
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画の再生回数がインクリメントされました。"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
  /api/videos/{id}/likes:
    get:
      summary: "動画をいいねしたユーザーID一覧の取得"
      operationId: getVideoLikes
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画をいいねしたユーザーID一覧を返します。"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: "ユーザーID"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
    post:
      summary: "動画のいいねの追加"
      operationId: addVideoLike
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画のいいねが追加されました。"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
    delete:
      summary: "動画のいいねの削除"
      operationId: deleteVideoLike
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画のいいねが削除されました。"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
  /api/videos/{id}/thumbnail:
    get:
      summary: "動画のサムネ画像へのリダイレクト"
      operationId: getVideoThumbnail
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "302":
          description: "動画のサムネ画像へのリダイレクト"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
  /api/videos/{id}/thumbnails/{thumbnailId}:
    get:
      summary: "サムネイル画像へリダイレクト"
      operationId: getVideoThumbnailUrl
      description: "サムネイル画像のURLを返すのではなく、直接サムネイル画像へリダイレクトします。これはWebTTファイル内でのみ使用します。"
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
        - name: thumbnailId
          in: path
          required: true
          schema:
            type: string
          description: "サムネイルのID"
      responses:
        "302":
          description: "サムネイル画像へのリダイレクト"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画またはサムネイルが見つかりませんでした。"
  /api/videos/{id}/vtt:
    get:
      summary: "動画のサムネイルのWebVTTファイルの取得"
      operationId: getVideoThumbnailsVtt
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画のサムネイルのWebVTTファイルを返します。"
          content:
            text/vtt:
              schema:
                type: string
                description: "動画のサムネイルのWebVTTファイルの内容"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
  /api/videos/{id}/tags:
    get:
      summary: "動画のタグの取得"
      operationId: getVideoTags
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画のタグを返します。"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tag_id:
                      type: number
                    name:
                      type: string
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
    post:
      summary: "動画のタグの追加"
      operationId: addVideoTag
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: string
                  description: "追加するタグ"
      responses:
        "200":
          description: "動画のタグが追加されました。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag_id:
                    type: number
                  name:
                    type: string
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
    delete:
      summary: "動画のタグの削除"
      description: "動画からタグを削除します。タグそのものは消えません。"
      operationId: deleteVideoTag
      x-tested: true
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_id:
                  type: number
                  description: "削除するタグのid"
      responses:
        "200":
          description: "動画のタグが削除されました。"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画またはタグが見つかりませんでした。"
  /api/tag:
    get:
      summary: "タグの検索"
      operationId: searchTags
      x-tested: true
      tags:
        - Tag
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: "タグの検索クエリ"
      responses:
        "200":
          description: "タグの検索結果(タグの配列)を返します。"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tag_id:
                      type: number
                    name:
                      type: string
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "タグが見つかりませんでした。"
    delete:
      summary: "タグの削除"
      description: "タグを完全に削除します。タグが付いている動画からもタグが消えます。"
      operationId: deleteTag
      x-tested: true
      tags:
        - Tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_id:
                  type: number
                  description: "削除するタグのid"
      responses:
        "200":
          description: "タグが削除されました。"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "タグが見つかりませんでした。"
  /api/auth/login:
    get:
      summary: 部員認証（SSO）用リダイレクトエンドポイント
      operationId: authLogin
      x-tested: true
      description: |
        PaaS側の部員認証（リバースプロキシ認証）を確実に通過させるためのエンドポイント。
        フロントエンドからこのURLへ画面自体を遷移させることで、PaaSのログインフローをトリガーします。
        Drogon側での処理後、クエリパラメータ `redirect` で指定されたフロントエンド内のパスへ 302 Found で送り返します。
        リダイレクト先のオリジンは、信頼済みのフロントエンドオリジンに固定します。
        `redirect` にはフロントエンド内の絶対パス、または設定されたフロントエンドオリジンと完全に一致する同一オリジンURLを指定できます。
        `redirect` が未指定または不正な場合は `/` へ戻します。
      tags:
        - Auth
      parameters:
        - name: redirect
          in: query
          description: 認証完了後に戻るフロントエンド内の絶対パス、または設定されたフロントエンドオリジンと完全に一致する同一オリジンURL。内部パスはURIデコード後の値が、空でない、`/` で始まる、`//` では始まらない、バックスラッシュとASCII制御文字を含まない、のすべてを満たす必要があります。外部URLは指定できません。
          schema:
            type: string
            format: uri-reference
      responses:
        "302":
          description: 認証完了。指定されたURLへリダイレクトします。
          headers:
            Location:
              description: リダイレクト先のURL
              schema:
                type: string
                format: uri
  /api/auth/user:
    get:
      summary: "ログインしているユーザーIDの取得"
      operationId: getCurrentUser
      x-tested: false
      tags:
        - Auth
      responses:
        "200":
          description: "ログインしているユーザーIDを返します。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: "ログインしているユーザーのID"
        "401":
          description: "認証されていません。"
  /webhooks/minio:
    post:
      summary: "動画アップロードの通知用"
      operationId: minioWebhook
      x-tested: true
      tags:
        - Webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /webhooks/encode_result:
    post:
      summary: "動画エンコードの完了通知用"
      operationId: encodeResultWebhook
      tags:
        - Webhook
      x-tested: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                videoId:
                  type: string
                  description: "動画のID"
                status:
                  type: string
                  description: "エンコードの状態(completed, failed)"
                message:
                  type: string
                  description: "success or error message"
                duration:
                  type: number
                  description: "動画の長さ(秒)"
  /ws/comments:
    get:
      summary: "コメント送受信用WebSocket"
      operationId: connectCommentsWebSocket
      description: |
        リアルタイムでコメントを受信するためのWebSocketエンドポイントです。
        ※このエンドポイントはHTTP GETリクエストからWebSocket(ws:// または wss://)へアップグレードされます。
        コメントの投稿自体は `POST /api/videos/{id}/comments` を使用してください。
      x-tested: true
      tags:
        - Comment
      parameters:
        - name: video_id
          in: query
          required: true
          schema:
            type: string
          description: "接続する動画のID"
      responses:
        "101":
          description: "Switching Protocols (WebSocket接続確立)"
        "400":
          description: "video_idが指定されていない等のエラー"
  /share/{id}:
    get:
      summary: "動画ページへのリダイレクト"
      operationId: redirectSharePage
      description: |
        ユーザーがアクセスした場合は動画ページへリダイレクト。
        Botがアクセスした場合はOGP情報を返す（BotのUser-Agentを判定してリダイレクトかOGP情報の返却かを切り替える）。
      x-tested: false
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "OGP情報を返します。"
          content:
            text/html:
              schema:
                type: string
                description: OGPメタタグを含むHTML
        "302":
          description: "動画ページへのリダイレクト"
  /share/{id}/thumbnail:
    get:
      summary: "動画のサムネイルへのリダイレクト"
      operationId: redirectShareThumbnail
      description: "動画のサムネイルへのリダイレクト"
      x-tested: false
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "302":
          description: "動画のサムネイルへのリダイレクト"
  /unauthApi/embed/{id}:
    get:
      summary: "署名付きurlを含む.m3u8ファイルの取得（埋め込み用）"
      operationId: getEmbedVideoPlayUrl
      x-tested: false
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: "埋め込みURLのトークン"
      responses:
        "200":
          description: "署名付きurlを含む.m3u8ファイルを返します。"
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                description: "署名付きurlを含む.m3u8ファイルの内容"
        "403":
          description: "アクセスが拒否されました。無効なトークンの可能性があります。"
        "404":
          description: "動画が見つかりませんでした。"
  /unauthApi/embed/{id}/vtt:
    get:
      summary: "動画のサムネイルのWebVTTファイルの取得（埋め込み用）"
      operationId: getEmbedVideoThumbnailsVtt
      x-tested: false
      tags:
        - Video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: "埋め込みURLのトークン"
      responses:
        "200":
          description: "動画のサムネイルのWebVTTファイルを返します。"
          content:
            text/vtt:
              schema:
                type: string
                description: "動画のサムネイルのWebVTTファイルの内容"
        "403":
          description: "アクセスが拒否されました。無効なトークンの可能性があります。"
        "404":
          description: "動画が見つかりませんでした。"
  /unauthApi/embed/{id}/comments:
    get:
      summary: "動画のコメントの取得（埋め込み用）"
      operationId: getEmbedComments
      x-tested: false
      tags:
        - Comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "動画のID"
      responses:
        "200":
          description: "動画のコメントを返します。"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/Comment"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "動画が見つかりませんでした。"
  /api/user/{id}/likes:
    get:
      summary: "ユーザーがいいねした動画ID一覧の取得"
      operationId: getUserLikes
      x-tested: false
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "ユーザーのID"
      responses:
        "200":
          description: "ユーザーがいいねした動画ID一覧を返します。"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: "動画ID"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "ユーザーが見つかりませんでした。"
  /api/user/{id}/comments:
    get:
      summary: "ユーザーがコメントした動画IDの一覧の取得"
      operationId: getUserComments
      x-tested: false
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "ユーザーのID"
      responses:
        "200":
          description: "ユーザーがコメントした動画IDの一覧を返します。"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: "動画ID"
        "403":
          description: "アクセスが拒否されました。"
        "404":
          description: "ユーザーが見つかりませんでした。"
components:
  schemas:
    Video:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: "動画の作成日時"
        video_id:
          type: string
          readOnly: true
          description: "動画のID"
        title:
          type: string
          readOnly: true
          description: "動画のタイトル"
        description:
          type: string
          readOnly: true
          description: "動画の説明"
        video_url:
          type: string
          readOnly: true
          description: "動画の公開用URL"
        thumbnail_url:
          type: string
          readOnly: true
          description: "動画の公開用サムネイルURL"
        upload_url:
          type: string
          readOnly: true
          description: "動画のアップロード用URL"
        upload_thumbnail_url:
          type: string
          readOnly: true
          description: "動画のサムネイルアップロード用URL"
        user_id:
          type: string
          readOnly: true
          description: "動画を投稿したユーザーのID"
        type:
          type: string
          readOnly: true
          description: "動画の種類(youtube, youtube live , internal)"
        view_count:
          type: integer
          readOnly: true
          description: "動画の再生回数"
        like_count:
          type: integer
          readOnly: true
          description: "動画のいいね数"
        status:
          type: integer
          readOnly: true
          description: "動画の状態(pending, processing, completed, failed)"
        is_external:
          type: boolean
          readOnly: true
          description: "外部動画かどうか"
        duration:
          type: number
          readOnly: true
          description: "動画の長さ(秒)"
    Comment:
      type: object
      properties:
        comment_id:
          type: integer
          readOnly: true
          description: "コメントのID"
        comment:
          type: string
          description: "コメントの内容"
        timestamp:
          type: number
          format: double
          description: "コメントの投稿時間"
        userId:
          type: string
          readOnly: true
          description: "コメントを投稿したユーザーのID"
        command:
          type: string
          readOnly: true
          description: "コメントのコマンド(Json文字列)"
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: "コメントの作成日時"
